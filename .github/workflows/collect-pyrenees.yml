name: Collecte Pyrénées

on:
  # Collecte automatique assurée par Cron-Job.org (job 8523882).
  workflow_dispatch:

concurrency:
  group: infodrop-pyrenees-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actualiser le flux Pyrénées
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Le secret CRON_SECRET n'est pas configuré."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --max-time 55 --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://www.infodrop.live/api/parse-local-rss)"

          echo "$response" | jq -e \
            '.success == true and .sources_checked > 0 and .sources_ok == .sources_checked and .sources_failed == 0' \
            > /dev/null
          echo "$response" | jq \
            '{edition, sources_checked, sources_ok, sources_failed, articles_qualified, articles_inserted, articles_updated, duration_ms}'
